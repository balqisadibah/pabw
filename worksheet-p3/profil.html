<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Film Favorit Saya</title>
</head>
<body>

    <header>
        <h1>Daftar Film Favorit Saya</h1>
        <nav aria-label="Navigasi utama">
            <ul>
                <li><a href="#daftar-film">Daftar Film</a></li>
                <li><a href="#tambah-film">Tambah Film</a></li>
                <li><a href="#tentang-saya">Tentang Saya</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="daftar-film">
            <h2>Daftar Film</h2>
            <img src="film-1.webp" alt="Poster film favorit" width="200" height="300">
            
            <table>
                <caption>Daftar Film yang Pernah Saya Tonton</caption>
                <thead>
                    <tr>
                        <th scope="col">Judul</th>
                        <th scope="col">Tahun</th>
                        <th scope="col">Sutradara</th>
                        <th scope="col">Rating</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Inception</td>
                        <td>2010</td>
                        <td>Christopher Nolan</td>
                        <td>9/10</td>
                    </tr>
                    <tr>
                        <td>Interstellar</td>
                        <td>2014</td>
                        <td>Christopher Nolan</td>
                        <td>9.5/10</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section id="tambah-film">
            <h2>Tambah Film</h2>
            <form action="#" method="post">
                <p>
                    <label for="judul">Judul Film:</label><br>
                    <input type="text" id="judul" name="judul" required>
                </p>
                <p>
                    <label for="tahun">Tahun Rilis:</label><br>
                    <input type="number" id="tahun" name="tahun" min="1900" max="2026" required>
                </p>
                <p>
                    <label for="rating">Rating (1-10):</label><br>
                    <input type="number" id="rating" name="rating" min="1" max="10" step="0.1" required>
                </p>
                <button type="submit">Simpan Film</button>
            </form>
        </section>
    </main>

    <footer>
        <p id="tentang-saya">Balqis Quratu'ain Adibah - 25523178 - 2026</p>
    </footer>

</body>
</html>
